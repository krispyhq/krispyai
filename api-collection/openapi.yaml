# OpenAPI 3.1 contract for the @krispy/edge Cloudflare Worker.
#
# This file IS the contract — there is NO auto-generation from the Worker. It only
# stays true if you edit it in the same change as the route (see AGENTS.md §7). The
# ground truth it mirrors: services/edge/src/index.ts (routing + handlers),
# services/edge/src/types.ts (TenantConfig / WidgetTheme / FormSpec / Connector),
# the Bruno collection in api-collection/, and apps/docs/content/docs/reference/edge-routes.mdx.
#
# Auth model: per-route shared-secret HEADERS, plus a bearer on the operator surface.
# Public routes are CORS-* and secret-free; secret-guarded routes carry a bot token or
# mutate config, so a missing/wrong secret returns 401 (config routes) or 403 (webhook,
# billing) and leaks nothing. The /api/operator/* routes (and the ?role=operator WS
# upgrade) take the operator app's bearer, verified in-Worker against the cloud API's
# GET /me (see `operatorBearer`), OR the tenant-sync secret for server-to-server callers.
openapi: 3.1.0
info:
  title: Krispy edge Worker API
  version: 0.1.0
  description: >
    One Cloudflare Worker hosts every HTTP route below plus the hibernatable `SessionDO`.
    CORS allow-origin is `ALLOWED_ORIGIN` (default `*`); every route answers `OPTIONS` with 204.
    The `SessionDO`'s internal surface (`/state`, `/operator`, `/handoff`) is Worker-only and
    intentionally NOT documented here — the browser never calls it directly.
  license:
    name: MIT
    url: https://github.com/lonormaly/krispyai/blob/master/LICENSE
servers:
  - url: http://localhost:8787
    description: local (wrangler dev)
  - url: https://edge.krispyai.com
    description: production edge Worker (custom domain, attached in CF after first deploy)

tags:
  - name: public
    description: CORS-*, secret-free — the widget/browser calls these.
  - name: secret-guarded
    description: Carry a bot token or mutate config — require a shared-secret header.

paths:
  /api/call:
    post:
      tags: [public]
      summary: Visitor audio call control
      operationId: visitorCall
      description: >
        Requires the session's registered visitorSecret capability. `invite` requires
        enabled visitor requests and, by default, an active human handoff. A new
        visitor request sends one operator push; repeating it while ringing is
        idempotent. `status` includes availableToRequest, which never claims an
        operator is online. The invitation recipient accepts or declines, the
        requester cancels, and either participant may end an accepted call.
        `grant` issues a room token only after acceptance.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, visitorSecret, action]
              properties:
                tenantId: { type: string }
                sessionId: { type: string }
                visitorSecret: { type: string }
                action:
                  { type: string, enum: [status, invite, accept, decline, cancel, end, grant] }
                id: { type: string, description: "Required except for status and invite." }
                nonce:
                  { type: string, description: "Required for visitor transitions after invite." }
      responses:
        "200":
          description: Call status, transition result, or short lived LiveKit grant.
          headers:
            Access-Control-Allow-Origin:
              description: Configured widget origin (or wildcard when unrestricted), including coordinator-owned grant responses.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  call: { $ref: "#/components/schemas/AudioCall" }
                  nonce: { type: string }
                  available: { type: boolean }
                  availableToRequest: { type: boolean }
                  url: { type: string }
                  token: { type: string }
                  clientUrl: { type: string }
        "400": { description: "Invalid request body." }
        "401": { description: "Visitor capability missing." }
        "403": { description: "Wrong actor, nonce, or disabled call setting." }
        "409": { description: "Stale call, missing handoff, or unavailable visitor." }
        "429": { description: "Visitor request limited to one new request per minute." }
        "502": { description: "Room disconnect failed after an end transition." }
        "503": { description: "RTC unavailable or previous room cleanup pending." }
  /api/operator/call:
    post:
      tags: [secret-guarded]
      summary: Operator audio call control
      operationId: operatorCall
      description: >
        Same session call as /api/call. Operators may invite a connected visitor,
        accept or decline a visitor request, cancel their own invitation, end an
        accepted call, or obtain a grant after acceptance. Requires an operator
        bearer or tenant sync secret.
      security:
        - operatorBearer: []
        - tenantSyncSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, sessionId, action]
              properties:
                tenantId: { type: string }
                sessionId: { type: string }
                action:
                  { type: string, enum: [status, invite, accept, decline, cancel, end, grant] }
                id: { type: string }
      responses:
        "200": { description: "Call status, transition result, or room grant." }
        "400": { description: "Invalid request body." }
        "401": { description: "Operator authentication required." }
        "403": { description: "Wrong actor or calls disabled." }
        "409": { description: "Stale call or visitor unavailable for operator invite." }
        "502": { description: "Room disconnect failed." }
        "503": { description: "RTC unavailable or cleanup pending." }
  /api/livekit/webhook:
    post:
      tags: [secret-guarded]
      summary: Signed LiveKit media event for a coordinator-owned call
      operationId: livekitWebhook
      description: >
        LiveKit sends the raw JSON body and its HS256 Authorization JWT. The Worker
        verifies issuer, signature, and raw-body sha256, then rechecks the
        SessionDO's persisted owner. Legacy calls are acknowledged and ignored.
        participant_joined requires both signed peers and a simultaneous
        authenticated room observation before recording connection; room_finished
        advances terminal state. Duplicate and old events are idempotent.
      security:
        - livekitWebhookToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, event, room, createdAt]
              properties:
                id: { type: string, format: uuid }
                event: { type: string, enum: [participant_joined, participant_left, room_finished] }
                createdAt: { type: integer, description: "Signed LiveKit Unix seconds." }
                room:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
                participant:
                  type: object
                  properties:
                    identity: { type: string }
      responses:
        "200": { description: "Verified event acknowledged or unrelated legacy event ignored." }
        "401": { description: "Invalid signature, issuer, or body hash." }
        "503": { description: "Coordinator or persisted owner temporarily unavailable; retry." }
  /api/internal/call-coordinator/availability:
    post:
      tags: [secret-guarded]
      summary: Cloud checks a thread's native invitation availability
      operationId: nativeCallAvailability
      security: [{ tenantSyncSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NativeCallPrincipal" }
      responses:
        "200":
          {
            description: "{ canInvite, reason } from tenant/site config, visitor presence and occupancy.",
          }
        "403": { description: "Missing or wrong tenant sync secret." }
  /api/internal/call-coordinator/start:
    post:
      tags: [secret-guarded]
      summary: Cloud starts a native outgoing invitation
      operationId: nativeCallStart
      security: [{ tenantSyncSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/NativeCallPrincipal" }
                - type: object
                  required: [actionEventId]
                  properties:
                    actionEventId: { type: string }
      responses:
        "200":
          {
            description: "Canonical call decision with callId, sessionId, status, revision, expiresAt and disposition.",
          }
        "403": { description: "Unauthorized or tenant/site calls disabled." }
        "409": { description: "Visitor unavailable, legacy call active or operator busy." }
  /api/internal/call-coordinator/action:
    post:
      tags: [secret-guarded]
      summary: Cloud applies an authenticated native call action
      operationId: nativeCallAction
      security: [{ tenantSyncSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/NativeCallPrincipal" }
                - type: object
                  required: [callId, actionEventId, action]
                  properties:
                    callId: { type: string, format: uuid }
                    actionEventId: { type: string }
                    action: { type: string, enum: [accept, decline, cancel_outgoing, end] }
      responses:
        "200": { description: "Canonical idempotent call decision." }
        "403": { description: "Unauthorized or wrong call actor." }
        "404": { description: "Call not owned by this session." }
  /api/internal/call-coordinator/status:
    post:
      tags: [secret-guarded]
      summary: Cloud reads canonical per-device call state
      operationId: nativeCallStatus
      security: [{ tenantSyncSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/NativeCallPrincipal" }
                - type: object
                  required: [callId]
                  properties:
                    callId: { type: string, format: uuid }
      responses:
        "200": { description: "Canonical call decision, including losing-device disposition." }
        "404": { description: "Call not owned by this session." }
  /api/internal/call-coordinator/grant:
    post:
      tags: [secret-guarded]
      summary: Cloud obtains a short-lived winner-only room grant
      operationId: nativeCallGrant
      security: [{ tenantSyncSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/NativeCallPrincipal" }
                - type: object
                  required: [callId]
                  properties:
                    callId: { type: string, format: uuid }
      responses:
        "200": { description: "{ callId, revision, livekitUrl, token } only after acceptance." }
        "409": { description: "Call not accepted by this device." }
  /api/internal/call-coordinator/revoke-device:
    post:
      tags: [secret-guarded]
      summary: Cloud waits for old installation offers and room cleanup on rebind
      operationId: nativeCallRevokeDevice
      security: [{ tenantSyncSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, deviceInstanceId, actionEventId]
              properties:
                tenantId: { type: string }
                deviceInstanceId: { type: string, format: uuid }
                actionEventId: { type: string, description: "Stable rebind:<jobId> retry key." }
      responses:
        "200": { description: "{ cleanupConfirmed: true } only after verified closure." }
        "202": { description: "{ cleanupConfirmed: false }; retry the same actionEventId." }
  /api/internal/call-coordinator/offer-validity:
    post:
      tags: [secret-guarded]
      summary: Cloud rechecks the exact per-device offer before sending APNs
      operationId: nativeCallOfferValidity
      security: [{ tenantSyncSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, callId, operatorId, deviceInstanceId, offerId, expiresAt]
              properties:
                tenantId: { type: string }
                callId: { type: string, format: uuid }
                operatorId: { type: string }
                deviceInstanceId: { type: string, format: uuid }
                offerId: { type: string }
                expiresAt: { type: integer }
      responses:
        "200":
          {
            description: "{ valid: boolean }; unrelated global revision changes do not invalidate a live offer.",
          }
  /health:
    get:
      tags: [public]
      summary: Liveness probe
      operationId: health
      security: [] # public — no auth
      responses:
        "200":
          description: Worker is up.
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: edge }

  /api/chat:
    post:
      tags: [public]
      summary: Visitor message → AI reply (mirrored to the owner's Telegram topic)
      operationId: chat
      description: >
        Before answering, the Worker checks entitlement + plan limits. The self-host tenant
        (`"self"`) is always entitled and unmetered; a non-self tenant with no valid snapshot
        gets 402, and one over its cap gets 429. After escalation, `handoffState: pending`
        keeps later visitor messages flowing to the operator and ring while suppressing AI;
        `operator` begins only with a human reply, and resolve/handback returns it to `ai`.
      security: [] # public — no auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: The AI (or handoff) result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResult" }
        "400":
          description: Missing `sessionId` or `message`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: >
            message_too_large — the `message` exceeds the absurd-payload hard cap (~32KB),
            rejected before any work (cost-DoS guard). A legit-but-long message under the cap
            is NOT rejected — it is silently truncated to 4000 chars before the model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "402":
          description: subscription_required — non-self tenant without a valid entitlement snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntitlementError" }
        "429":
          description: usage_limit_reached — tenant is over its plan cap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntitlementError" }

  /api/contact:
    post:
      tags: [public]
      summary: Legacy contact-capture shim → owner's Telegram topic
      operationId: contact
      description: >
        Legacy contact-capture: drops name/contact/message into the visitor's existing topic.
        Superseded by the generalized `/api/lead` fan-out; kept for older embeds.
      security: [] # public — no auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactRequest" }
      responses:
        "200":
          description: Acknowledged (delivery is best-effort; no topic → no-op).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400":
          description: Missing `sessionId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/lead:
    post:
      tags: [public]
      summary: A form's captured values fan out to the tenant's delivery connectors
      operationId: lead
      description: >
        The generalized lead endpoint: a data-driven form's `values` fan out to the tenant's
        DELIVERY connectors (Telegram topic + email via Resend). `whatsapp`/`instagram`
        connectors are CTA-only — nothing is delivered server-side for them. Rate-limited per
        (tenant, session). For a configured form with an email delivery connector,
        success requires an accepted email delivery; a failed delivery returns 502
        so the widget keeps the form available for retry.
      security: [] # public — no auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadRequest" }
      responses:
        "200":
          description: Accepted and fanned out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400":
          description: Missing `sessionId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: rate_limited — too many lead submissions for this (tenant, session).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: delivery_failed — the configured form's email was not accepted for delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/widget/config:
    get:
      tags: [public]
      summary: Public, secret-free widget appearance projection
      operationId: widgetConfig
      description: >
        The widget's boot-time read of its appearance/forms. Returns ONLY the whitelist
        projection (`capabilities`, `theme`, `ctas`, `forms`, `script`, `popups`) — NEVER
        botToken/chatId/systemPrompt/persona. Do not confuse with the secret-guarded
        `GET /api/tenant/config`, which returns the full config.
      security: [] # public — no auth
      parameters:
        - $ref: "#/components/parameters/Tenant"
      responses:
        "200":
          description: The public projection (fields are all optional / may be absent).
          content:
            application/json:
              schema:
                type: object
                properties:
                  capabilities:
                    type: object
                    required: [attachments]
                    properties:
                      attachments:
                        type: boolean
                        description: "Whether screenshot paste/drop has a configured Telegram delivery channel."
                  theme: { $ref: "#/components/schemas/WidgetTheme" }
                  ctas:
                    type: array
                    description: "CTA-capable connectors (minus cta:false opt-outs), with server-built href + default label."
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        type: { $ref: "#/components/schemas/ConnectorType" }
                        label: { type: string }
                        caption: { type: string }
                        url: { type: string, description: "wa.me/tel/https, built server-side." }
                        showAfterMs: { type: integer }
                  forms:
                    type: array
                    description: "Visitor-renderable configured forms. Delivery connector IDs and destinations remain server-side."
                    items:
                      type: object
                      required: [id, title, fields]
                      properties:
                        id: { type: string }
                        title: { type: string }
                        fields:
                          type: array
                          items: { $ref: "#/components/schemas/FormField" }
                        successText: { type: string }
                  script: { $ref: "#/components/schemas/ConversationScript" }
                  popups:
                    type: array
                    items: { $ref: "#/components/schemas/PopupSpec" }

  /api/usage:
    get:
      tags: [public]
      summary: Metering readout — usage counters vs the entitlement's caps
      operationId: usage
      security: [] # public — no auth
      parameters:
        - $ref: "#/components/parameters/Tenant"
      responses:
        "200":
          description: Usage + plan snapshot for the tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageResponse" }

  /internal/usage:
    get:
      tags: [internal]
      summary: Cross-tenant cost readout for the Krispy Cloud admin (secret-authed)
      operationId: internalUsage
      description: >
        The founder admin's per-tenant token counters (in/out split) so the Cloud app can
        price input vs output separately. workerd (the Cloud app) can't read the edge's KV
        directly, so the admin cost view fetches over this one guarded call. Fail-closed: no
        `ADMIN_USAGE_SECRET` configured, or a missing/mismatched header → 403 (the counters
        carry no auth of their own — never leaked unauthenticated). `t` accepts one tenant id
        or a comma-separated batch, so N tenants are fetched in one round-trip.
      security:
        - adminUsageSecret: []
      parameters:
        - name: t
          in: query
          required: true
          description: One tenant id, or a comma-separated batch (`a,b,c`).
          schema: { type: string }
      responses:
        "200":
          description: Month-to-date counters keyed by tenant id.
          content:
            application/json:
              schema:
                type: object
                required: [usage]
                properties:
                  usage:
                    type: object
                    additionalProperties: { $ref: "#/components/schemas/UsageDetail" }
        "400":
          description: Missing `t`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Missing/wrong `x-admin-usage-secret` (or the secret is not configured).

  /api/session/{id}/ws:
    get:
      tags: [public]
      summary: Visitor's live channel — WebSocket upgrade forwarded to the SessionDO
      operationId: sessionWs
      description: >
        A WebSocket upgrade request; the Worker forwards it to the `(tenant, session)` DO. The
        visitor receives `{ type: "ready", handoffState, handedOff }` on connect, then
        `operator` / `handoff` / `resume` events carrying the resulting `handoffState`.
        `pending` means a human was notified but has not replied, so reconnecting widgets show
        a waiting message rather than claiming somebody joined. `{ type: "resume" }` = the AI
        took the session back — sent when an
        operator resolves it (app swipe, `/api/operator/resolve`, Telegram `/done`) or when the
        operator-silence alarm fires (`HANDBACK_SILENCE_MINUTES` after a visitor message on a
        handed-off session with no operator reply, default 5). The widget drops its "human
        joined" framing and the bot answers again. Not a normal JSON response — this row
        documents the upgrade contract.
        With `role=operator` the DO tags the socket as an operator's (the Buttr app's in-thread
        live channel) — it receives the full event union PLUS the operator-only
        `{ type: "message", role: "visitor" | "ai", text, ts }` mirror of live ring appends
        (seed replays stay silent). The visitor fan-out is untouched.
        With `role=operator` the upgrade REQUIRES `auth=<bearer token>` — RN/browsers can't
        set headers on a WS upgrade, so the operator app's bearer rides as a query param and
        is verified exactly like the `operatorBearer` header scheme (401 invalid/missing,
        403 token↔tenant mismatch) before the upgrade reaches the DO.
      security: [] # public for visitors — operator sockets authenticate via ?auth
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The visitor's session id.
        - $ref: "#/components/parameters/Tenant"
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [operator] }
          description: Tag the socket as an operator's (Buttr app). Omit for the visitor widget.
        - name: auth
          in: query
          required: false
          schema: { type: string }
          description: >
            Operator bearer token (REQUIRED when `role=operator`, ignored otherwise).
            Same token/verification as the `operatorBearer` scheme.
        - name: Upgrade
          in: header
          required: true
          schema: { type: string, const: websocket }
      responses:
        "101":
          description: Switching Protocols — WebSocket established (handled by the DO).
        "401":
          description: "`role=operator` without a valid `auth` token."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "`role=operator` with a valid token that belongs to another tenant."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "426":
          description: Upgrade Required — the request was not a WebSocket upgrade.

  /api/operator/reply:
    post:
      tags: [public]
      summary: Operator app reply into a live visitor thread
      operationId: operatorReply
      description: >
        The Buttr operator app's reply — the second trigger of the same SessionDO handoff spine
        Telegram uses. Moves the session from `pending` to `operator`, sets `handedOff`,
        appends the reply to the session's 20-message ring buffer, and broadcasts
        `{ type: "operator", handoffState: "operator", text }` to the visitor's WebSocket. The
        replying operator is learned with `channel: 'app'`, so the Telegram handoff @mention
        skips them (they get the push instead). Metered as a handoff. Auth: the app's bearer
        is verified in-Worker against the cloud API's `GET /me` and must resolve to the
        claimed `tenantId`; server-to-server callers may send `x-tenant-sync-secret` instead.
      security:
        - operatorBearer: []
        - tenantSyncSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperatorReplyRequest" }
      responses:
        "200":
          description: Delivered to the session's DO (visitor sockets notified).
          content:
            application/json:
              schema:
                type: object
                required: [ok, delivered]
                properties:
                  ok: { type: boolean, const: true }
                  delivered: { type: boolean, const: true }
        "400":
          description: Missing `tenantId`, `sessionId` or `text`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing/invalid credentials (no bearer or secret, expired token, or no `API_ORIGIN` verifier configured — auth fails closed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Valid bearer, but the token's user is not the claimed `tenantId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/operator/reply-drafts:
    post:
      tags: [public]
      summary: Generate up to three editable, contextual operator reply drafts
      operationId: operatorReplyDrafts
      description: >
        Operator-only read of the server-side 20-message session ring and tenant knowledge.
        The session's recorded site selects knowledge and provider; an optional siteId is
        only an assertion and a mismatch is rejected.
        Uses the tenant's configured AI provider; direct Gemini remains restricted to the
        approved tenant/site pilot. Never sends to the visitor. A request is limited to
        20 generations per tenant/session/hour (coarse KV counter; concurrent bursts may
        exceed the limit). Source material, transcript, output tokens
        and generation time are bounded. Empty drafts mean no supported suggestion was
        available. The source revision and last message timestamp let a client discard
        drafts after any transcript change; if the ring changes during generation, the
        server returns empty drafts with `stale: true` and the newer revision.
      security:
        - operatorBearer: []
        - tenantSyncSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperatorActionContext" }
      responses:
        "200":
          description: Editable drafts, or an empty array when unavailable.
          content:
            application/json:
              schema:
                type: object
                required: [drafts, sourceRevision, sourceLastMessageTs]
                properties:
                  drafts:
                    type: array
                    maxItems: 3
                    items: { type: string, maxLength: 500 }
                  sourceRevision:
                    { type: [string, "null"], description: SHA-256 of the server-side ring. }
                  sourceLastMessageTs: { type: [integer, "null"] }
                  stale: { type: boolean }
        "400": { description: Missing tenant/session or invalid siteId. }
        "401": { description: Missing or invalid operator credentials. }
        "403": { description: Operator belongs to another tenant or site assertion mismatches. }
        "404": { description: Session has no recorded tenant identity. }
        "429": { description: Session generation limit reached; drafts is empty. }

  /api/operator/actions:
    post:
      tags: [public]
      summary: List configured form and Instagram actions for a visitor session
      operationId: operatorActions
      description: >
        Requires an operator bearer or tenant-sync secret. The session's durable identity
        determines its site; optional siteId must match. Only configured visitor-facing
        Instagram connectors with HTTPS URLs are returned. No connector credentials are exposed.
      security:
        - operatorBearer: []
        - tenantSyncSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperatorActionContext" }
      responses:
        "200":
          description: Safe action choices for the session's site.
          content:
            application/json:
              schema:
                type: object
                required: [forms, connectors]
                properties:
                  forms:
                    type: array
                    items:
                      type: object
                      required: [id, title]
                      properties:
                        id: { type: string }
                        title: { type: string }
                  connectors:
                    type: array
                    items: { $ref: "#/components/schemas/OperatorInstagramConnector" }
        "400": { description: Missing tenant/session or invalid siteId. }
        "401": { description: Missing or invalid operator credentials. }
        "403": { description: Tenant or site mismatch. }
        "404": { description: Session has no recorded identity. }

  /api/operator/send-action:
    post:
      tags: [public]
      summary: Send a configured form or Instagram CTA card to a visitor
      operationId: operatorSendAction
      description: >
        Authenticates and resolves the configured item from the session's tenant and site.
        The resolved safe card is durably appended to the session ring and pushed by WebSocket.
        Moves handoff state to operator and meters one handoff.
      security:
        - operatorBearer: []
        - tenantSyncSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/OperatorActionContext" }
                - type: object
                  required: [kind, id]
                  properties:
                    kind: { type: string, enum: [form, instagram] }
                    id: { type: string }
      responses:
        "200":
          description: Card stored and broadcast.
          content:
            application/json:
              schema:
                type: object
                required: [ok, delivered, action]
                properties:
                  ok: { type: boolean, const: true }
                  delivered:
                    {
                      type: integer,
                      description: Number of live visitor WebSocket recipients; operator echoes are excluded.,
                    }
                  action: { $ref: "#/components/schemas/OperatorAction" }
        "400": { description: Missing or malformed request fields. }
        "401": { description: Missing or invalid operator credentials. }
        "403": { description: Tenant or site mismatch. }
        "404": { description: Session or configured action not found. }

  /api/operator/handoffs:
    post:
      tags: [public]
      summary: Operator app inbox — the tenant's unresolved conversations
      operationId: operatorHandoffs
      description: >
        With `includeActive: true`, every unresolved session for the tenant is listed, including
        AI-only conversations; legacy callers omit it to receive pending/operator-owned sessions.
        Results are newest activity first, each with a `lastMessage` preview from the session's ring buffer. Resolved sessions are
        EXCLUDED by default; pass `includeResolved: true` to list them too (rows carry
        `resolved: true`, `handoffState: ai` and `handedOff: false` — resolving hands the session back to
        the AI). New conversations use a Telegram-independent `handoff:<tenant>:<session>` KV
        index; active chats use a separate `conversation:<tenant>:<session>` index. The Worker
        unions those with the legacy session→thread index, de-duplicates session ids, and asks
        each SessionDO for a one-shot summary. Telegram is not required for Buttr inbox discovery,
        and topic linking cannot overwrite the discovery indexes.
      security:
        - operatorBearer: []
        - tenantSyncSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId]
              properties:
                tenantId: { type: string }
                includeResolved:
                  type: boolean
                  default: false
                  description: Also list resolved sessions.
                includeActive:
                  type: boolean
                  default: false
                  description: Also list unresolved AI-only conversations.
      responses:
        "200":
          description: The inbox list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorHandoffsResponse" }
        "400":
          description: Missing `tenantId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing/invalid credentials (no bearer or secret, expired token, or no `API_ORIGIN` verifier configured — auth fails closed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Valid bearer, but the token's user is not the claimed `tenantId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/operator/thread:
    post:
      tags: [public]
      summary: One session's messages from the DO ring buffer
      operationId: operatorThread
      description: >
        The session's last 20 messages (visitor / AI / operator) from the SessionDO ring
        buffer — zero Telegram round-trips. On handoff the ring is seeded from the history
        the widget re-sends on `/api/chat`, so pre-handoff turns are present.
      security:
        - operatorBearer: []
        - tenantSyncSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, sessionId]
              properties:
                tenantId: { type: string }
                sessionId: { type: string }
      responses:
        "200":
          description: The thread messages, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorThreadResponse" }
        "400":
          description: Missing `tenantId` or `sessionId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing/invalid credentials (no bearer or secret, expired token, or no `API_ORIGIN` verifier configured — auth fails closed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Valid bearer, but the token's user is not the claimed `tenantId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/operator/resolve:
    post:
      tags: [public]
      summary: Toggle a session's resolved flag (inbox hygiene + hand back to the AI)
      operationId: operatorResolve
      description: >
        Toggle the session's `resolved` flag in its SessionDO. Resolving ALSO hands the
        session back to the AI — pending/operator state becomes `handoffState: ai`,
        `handedOff` flips false, and `{ type: "resume", handoffState: "ai" }` is
        broadcast to the session's WebSockets (the widget drops its "human joined"
        framing), so the bot answers the visitor's next message. Resolved sessions drop
        out of the default `/api/operator/handoffs` inbox; toggling again un-resolves
        (undo an accidental swipe) WITHOUT re-handing-off — an operator reply re-takes
        over. A NEW live visitor message on a resolved session un-resolves it
        automatically (also without re-handing-off — the conversation is live again,
        answered by the AI).
      security:
        - operatorBearer: []
        - tenantSyncSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, sessionId]
              properties:
                tenantId: { type: string }
                sessionId: { type: string }
      responses:
        "200":
          description: The new resolved state.
          content:
            application/json:
              schema:
                type: object
                required: [ok, resolved]
                properties:
                  ok: { type: boolean, const: true }
                  resolved:
                    type: boolean
                    description: The state AFTER the toggle.
        "400":
          description: Missing `tenantId` or `sessionId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing/invalid credentials (no bearer or secret, expired token, or no `API_ORIGIN` verifier configured — auth fails closed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Valid bearer, but the token's user is not the claimed `tenantId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/telegram/webhook:
    post:
      tags: [secret-guarded]
      summary: Owner's Telegram reply → push to the visitor via the DO
      operationId: telegramWebhook
      description: >
        Telegram calls this with the owner's reply in a forum topic. The Worker verifies the
        secret Telegram echoes back, resolves the session for the topic, and pushes the reply
        to the visitor (setting `handedOff` and disarming the silence hand-back alarm).
        Non-owner updates are ack'd and ignored. COMMAND: a reply of exactly `/done` (or
        `resolved`, case-insensitive) is NOT forwarded to the visitor — it resolves the
        session and hands it back to the AI (same semantics as `/api/operator/resolve` with
        a force-set), then acks into the topic. The command is advertised in the handoff
        alert message.
      security:
        - telegramWebhookSecret: []
      requestBody:
        required: true
        description: A Telegram Update object (opaque here — only owner replies are acted on).
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: "`ok` — ack (whether or not it was an actionable owner reply)."
          content:
            text/plain:
              schema: { type: string, const: ok }
        "403":
          description: Missing/wrong `x-telegram-bot-api-secret-token`.

  /api/billing/entitlement:
    post:
      tags: [secret-guarded]
      summary: Mirror an entitlement snapshot into KV (hosted/multi-tenant only)
      operationId: billingEntitlement
      description: >
        A billing service (payment webhook / trial start) pushes a tenant's entitlement snapshot
        into KV so the `/api/chat` gate can read it. Unused in single-tenant self-host.
      security:
        - billingSyncSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntitlementSyncRequest" }
      responses:
        "200":
          description: Snapshot written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400":
          description: Missing `tenantId` or `snapshot`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Missing/wrong `x-billing-sync-secret` (or the secret is not configured).

  /api/tenant/config:
    get:
      tags: [secret-guarded]
      summary: Read a tenant's FULL config (bot token included)
      operationId: getTenantConfig
      description: >
        Returns the exact shape `getTenant()` consumes, including the bot token — so it is
        secret-guarded and never leaked without the header. 404 when the tenant has no config.
      security:
        - tenantSyncSecret: []
      parameters:
        - name: t
          in: query
          required: true
          schema: { type: string }
          description: Tenant id (self-host = `self`).
      responses:
        "200":
          description: The full tenant config.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantConfig" }
        "400":
          description: Missing `t`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing/wrong `x-tenant-sync-secret` (or the secret is not configured).
        "404":
          description: No config saved for this tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [secret-guarded]
      summary: Merge a partial config into the tenant's KV (the CLI writes here)
      operationId: setTenantConfig
      description: >
        MERGEs the provided `config` fields into KV `tenant:<tenantId>` — unset fields are
        preserved, so send only what changed. The `krispy` CLI's `set-kbase` posts here.
      security:
        - tenantSyncSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantConfigSetRequest" }
      responses:
        "200":
          description: Merged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400":
          description: >
            Missing `tenantId` or `config`, or a malformed value — `avatar_scheme_invalid`
            (`theme.avatar` must be `buttr`, `none`, `https://…`, or
            `data:image/(png|webp|jpeg);base64,…`) or `cta_url_not_https` (connector
            `profileUrl`/`url` must be https).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing/wrong `x-tenant-sync-secret` (or the secret is not configured).
        "413":
          description: >
            Config over a hard size cap — `avatar_too_large` (`theme.avatar` over 48KB),
            `kb_sources_too_large` (`kbSources` total text over 100K chars),
            `too_many_popups` (>8 popups), `popup_text_too_large` (popup `text` over 500
            chars), `popup_selector_too_large` (a `near` selector or `cancelOnClick` over
            200 chars), `too_many_opening` (>5 `script.opening`), `too_many_starters`
            (>4 `script.starters`), or `persona_script_too_large` (`persona` + `script`
            combined free text over 8K chars). Nothing is written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  parameters:
    Tenant:
      name: t
      in: query
      required: false
      schema: { type: string, default: self }
      description: Tenant id (self-host default = `self`).

  securitySchemes:
    operatorBearer:
      type: http
      scheme: bearer
      description: >
        The operator app's session token (krispyai-cloud Better Auth bearer). The Worker
        verifies it against the cloud API's `GET /me` (`API_ORIGIN`) and requires the
        server-resolved `tenantId` to equal the request's `tenantId` — this allows a
        verified teammate's token to operate the owner's tenant, while a valid token for
        a DIFFERENT tenant is 403. Older `/me` responses without `tenantId` use `user.id`
        as a backwards-compatible fallback; malformed identity fields fail closed.
        Verified tokens are cached in-isolate for 60s.
        On the WebSocket upgrade the same token is passed as the `auth` query parameter
        (RN/browsers cannot set headers on a WS upgrade).
    tenantSyncSecret:
      type: apiKey
      in: header
      name: x-tenant-sync-secret
      description: Must equal the Worker's `TENANT_SYNC_SECRET`.
    adminUsageSecret:
      type: apiKey
      in: header
      name: x-admin-usage-secret
      description: >
        Must equal the Worker's `ADMIN_USAGE_SECRET`. Fail-closed: if the secret is unset the
        endpoint 403s (never serves counters unauthenticated).
    billingSyncSecret:
      type: apiKey
      in: header
      name: x-billing-sync-secret
      description: Must equal the Worker's `BILLING_SYNC_SECRET`.
    telegramWebhookSecret:
      type: apiKey
      in: header
      name: x-telegram-bot-api-secret-token
      description: Must equal the Worker's `TELEGRAM_WEBHOOK_SECRET` (Telegram echoes it back).
    livekitWebhookToken:
      type: http
      scheme: bearer
      description: LiveKit HS256 JWT with API key issuer and raw-body sha256 claim.

  schemas:
    NativeCallPrincipal:
      type: object
      required: [tenantId, sessionId, operatorId, deviceInstanceId]
      properties:
        tenantId: { type: string }
        sessionId: { type: string }
        operatorId: { type: string, description: "Server-resolved Cloud operator ID." }
        deviceInstanceId: { type: string, format: uuid }

    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    UsageDetail:
      type: object
      description: One tenant's month-to-date counters (missing keys read as 0).
      required: [ai, handoff, tokens, tokensIn, tokensOut]
      properties:
        ai: { type: integer, description: AI conversations this month. }
        handoff: { type: integer, description: Handoffs to a human this month. }
        tokens: { type: integer, description: Total LLM tokens (in + out). }
        tokensIn: { type: integer, description: Prompt (input) tokens. }
        tokensOut: { type: integer, description: Completion (output) tokens. }

    EntitlementError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [subscription_required, usage_limit_reached]
        plan: { type: string }
        status: { type: string }

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant, system] }
        content: { type: string }

    RingMessage:
      type: object
      required: [role, text, ts]
      description: One entry of the SessionDO's 20-message ring buffer.
      properties:
        role: { type: string, enum: [visitor, ai, operator] }
        text: { type: string }
        ts:
          type: integer
          description: Unix epoch millis, stamped at append time.
        action: { $ref: "#/components/schemas/OperatorAction" }

    OperatorActionContext:
      type: object
      required: [tenantId, sessionId]
      properties:
        tenantId: { type: string }
        sessionId: { type: string }
        siteId:
          { type: string, description: Optional assertion against the session's recorded site. }

    OperatorInstagramConnector:
      type: object
      required: [id, type, label, url]
      properties:
        id: { type: string }
        type: { type: string, const: instagram }
        label: { type: string }
        caption: { type: string }
        url: { type: string, format: uri, description: Configured HTTPS profile URL. }

    OperatorAction:
      oneOf:
        - type: object
          required: [kind, form]
          properties:
            kind: { type: string, const: form }
            form:
              type: object
              required: [id, title, fields]
              properties:
                id: { type: string }
                title: { type: string }
                fields:
                  type: array
                  items: { $ref: "#/components/schemas/FormField" }
                successText: { type: string }
        - type: object
          required: [kind, connector]
          properties:
            kind: { type: string, const: instagram }
            connector: { $ref: "#/components/schemas/OperatorInstagramConnector" }

    OperatorReplyRequest:
      type: object
      required: [tenantId, sessionId, text]
      properties:
        tenantId: { type: string }
        sessionId: { type: string }
        text: { type: string, minLength: 1 }
        operatorName:
          type: string
          description: Display name learned onto the tenant's operator list (channel 'app').

    OperatorHandoffsResponse:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          description: Newest activity first.
          items:
            type: object
            required: [sessionId, siteId, lastMessage, handoffState, handedOff, ts, resolved]
            properties:
              sessionId: { type: string }
              siteId: { type: string, description: Session's recorded site (default when absent). }
              lastMessage:
                type: [string, "null"]
                description: The ring-buffer tail (null when the ring is empty).
              handedOff:
                type: boolean
                description: >
                  Backwards-compatible operator-took-over flag. False while pending and after
                  resolve; use `handoffState` to distinguish those cases.
              handoffState: { $ref: "#/components/schemas/HandoffState" }
              ts:
                type: [integer, "null"]
                description: Epoch millis of the last message (null when the ring is empty).
              resolved:
                type: boolean
                description: >
                  Always false in the default response (resolved sessions are excluded);
                  true only for rows returned via `includeResolved: true`.

    OperatorThreadResponse:
      type: object
      required: [messages, callReceipts]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/RingMessage" }
        callReceipts:
          type: array
          description: Durable typed call records, retained outside the 20-message chat ring.
          items: { $ref: "#/components/schemas/CallTimelineReceipt" }

    CallTimelineReceipt:
      type: object
      required:
        [
          callId,
          sessionId,
          startedAt,
          connectedAt,
          connectedTimeProvenance,
          endedAt,
          connectedDurationMs,
          outcome,
          endTimeProvenance,
          revision,
        ]
      properties:
        callId: { type: string, format: uuid }
        sessionId: { type: string }
        startedAt: { type: integer, description: Server epoch milliseconds when invited. }
        connectedAt:
          {
            type: [integer, "null"],
            description: Server-verified time both participants were present.,
          }
        connectedTimeProvenance:
          { type: [string, "null"], enum: [signed_event, observed_room_present, null] }
        endedAt:
          { type: integer, description: Verified media end or server-observed terminal time. }
        connectedDurationMs: { type: integer, minimum: 0 }
        outcome: { type: string, enum: [ended, missed, declined, canceled] }
        endTimeProvenance:
          {
            type: string,
            enum: [signed_event, observed_room_absent, confirmed_room_delete, server_transition],
          }
        revision: { type: integer, minimum: 1 }

    ChatRequest:
      type: object
      required: [sessionId, message]
      properties:
        sessionId: { type: string }
        message:
          type: string
          minLength: 1
          maxLength: 32768
          description: >
            Visitor text. Over ~32KB (32768) → 413 (cost-DoS guard). A message under the
            cap but over 4000 chars is accepted and silently truncated to 4000 before the
            model. Client history items are truncated the same way.
        tenantId: { type: string, default: self }
        history:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
          description: >
            SEED/FALLBACK ONLY. The bot's authoritative context is the server-side
            SessionDO ring; client history is used only when the ring is empty (first
            message of a legacy session) or when the ring read fails/times out
            (~1.5s guard). A non-empty ring always wins — spoofed history is ignored.

    HandoffState:
      type: string
      enum: [ai, pending, operator]
      description: >
        Who owns the next reply. `pending` starts when escalation notifies a human;
        `operator` starts with their first reply; resolve or silence handback restores `ai`.

    ChatResult:
      type: object
      required: [reply, handoff, handedOff, handoffState]
      properties:
        reply:
          type: [string, "null"]
          description: Visitor-facing reply, or null while a handoff is pending/operator-owned.
        handoff:
          type: boolean
          description: True only on the turn that initiated escalation and contact capture.
        handedOff:
          type: boolean
          description: Backwards-compatible true only after an operator replies.
        handoffState: { $ref: "#/components/schemas/HandoffState" }
        degraded:
          type: boolean
          description: The AI was unavailable and the Worker fell back to a human.
        formId:
          type: [string, "null"]
          description: When the AI emitted `[!FORM:<id>]`, the id of the form to render.
        form:
          oneOf:
            - $ref: "#/components/schemas/FormSpec"
            - type: "null"
          description: The resolved FormSpec for `formId` (public projection), when present.

    ContactRequest:
      type: object
      required: [sessionId]
      properties:
        sessionId: { type: string }
        tenantId: { type: string, default: self }
        name: { type: string }
        contact: { type: string }
        message: { type: string }

    LeadRequest:
      type: object
      required: [sessionId]
      properties:
        sessionId: { type: string }
        tenantId: { type: string, default: self }
        formId:
          type: [string, "null"]
          description: The FormSpec id this lead answers; null for the default form.
        values:
          type: object
          additionalProperties: { type: string }
          description: The form's captured field values (machine key → value).
        history:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }

    EntitlementSyncRequest:
      type: object
      required: [tenantId, snapshot]
      properties:
        tenantId: { type: string }
        snapshot:
          type: object
          description: EntitlementSnapshot (plan/status/limits) — opaque to the widget.
          additionalProperties: true

    TenantConfigSetRequest:
      type: object
      required: [tenantId, config]
      properties:
        tenantId: { type: string }
        config:
          allOf:
            - $ref: "#/components/schemas/TenantConfig"
          description: A partial config — only the provided fields are merged.

    UsageResponse:
      type: object
      required: [tenantId, usage, plan, entitled, status, limits, withinLimits]
      properties:
        tenantId: { type: string }
        usage:
          type: object
          properties:
            ai: { type: integer }
            handoff: { type: integer }
            tokens: { type: integer }
        plan: { type: string }
        entitled: { type: boolean }
        status: { type: string }
        limits:
          type: object
          additionalProperties: true
        withinLimits: { type: boolean }

    WidgetTheme:
      type: object
      description: Public widget appearance projection (all fields optional).
      properties:
        launcherStyle:
          { type: string, enum: [circle, pill], description: "Launcher shape. Default circle." }
        launcherLabel:
          {
            type: string,
            description: "Pill label; displayed trimmed to 24 characters. Defaults to the widget title.",
          }
        primaryColor:
          {
            type: string,
            description: "Header + visitor bubble + send button. Default gold #e39a2b.",
          }
        launcherColor:
          {
            type: string,
            description: "Optional mascot badge fill. Unset or transparent keeps Buttr floating without a disc.",
          }
        position:
          { type: string, enum: [br, bl], description: "bottom-right | bottom-left. Default br." }
        glowColor:
          {
            type: string,
            description: "Hex; launcher glow/sparkle/pulse tint. Unset = no glow layer (default).",
          }
        avatar:
          {
            type: string,
            description: '"buttr" (default), "none" for a text-only header, an https URL, or a data:image/… URI (≤48KB).',
          }
        greeting: { type: string, description: "First bot bubble on open." }
        headerTitle: { type: string }
        tagline: { type: string, description: "Header sub-line (e.g. usually replies in minutes)." }
        radius:
          { type: integer, minimum: 0, maximum: 20, description: "Corner radius px. Default 14." }
        font: { type: string, description: "CSS font-family stack." }
        sound: { type: boolean, description: "Notification ding while panel closed. Default true." }
        sparkle: { type: boolean, description: "Idle sparkle loop on the launcher. Default false." }
        direction:
          { type: string, enum: [ltr, rtl], description: "Panel text direction. Default ltr." }
        popupText: { type: string, description: "Proactive teaser-popup copy. Unset = popup off." }
        timing: { $ref: "#/components/schemas/WidgetTiming" }

    WidgetTiming:
      type: object
      description: >
        All ms; the widget clamps 0–300000. Each knob takes effect only when its feature
        is enabled — none changes the default widget on its own.
      properties:
        launcherDelayMs: { type: integer, description: "Default 0 = no entrance delay." }
        sparkleAfterMs: { type: integer, description: "Default 10000; inert unless sparkle." }
        popupDelayMs: { type: integer, description: "Default 8000; inert unless popupText." }
        popupCooldownHrs: { type: integer, description: "Default 24; inert unless popupText." }
        autoOpenMs:
          {
            type: integer,
            description: "Default 0 = never — auto-open after inbound msg while closed.",
          }

    FieldType:
      type: string
      enum: [text, email, tel, textarea, select]

    FormField:
      type: object
      required: [name, label, type]
      properties:
        name: { type: string, description: "Machine key, e.g. budget." }
        label: { type: string, description: "Visitor-facing." }
        type: { $ref: "#/components/schemas/FieldType" }
        required: { type: boolean }
        options:
          type: array
          items: { type: string }
          description: "select only."

    FormSpec:
      type: object
      required: [id, title, fields]
      properties:
        id: { type: string, description: "Referenced by [!FORM:<id>]." }
        title: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/FormField" }
        connectorIds:
          type: array
          items: { type: string }
          description: "Which connectors receive this lead; default = ALL configured."

    ConnectorType:
      type: string
      enum: [email, telegram, whatsapp, phone, instagram, facebook, tiktok, link]

    Connector:
      type: object
      required: [id, type]
      description: >
        Delivery channel and/or visitor-facing CTA. The CTA fields (cta/label/caption/
        showAfterMs) are inert on the delivery-only types (email/telegram).
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/ConnectorType" }
        toAddress: { type: string, description: "email." }
        phone: { type: string, description: "whatsapp/phone (digits, no +)." }
        profileUrl: { type: string, description: "instagram (https)." }
        url: { type: string, description: "facebook/tiktok/link (https)." }
        cta:
          {
            type: boolean,
            description: "Default true for CTA-capable types — false keeps it delivery-only.",
          }
        label: { type: string, description: "Button label; projection fills a per-type default." }
        caption: { type: string, description: "Small text above the button." }
        showAfterMs:
          {
            type: integer,
            description: "Per-CTA stagger after the first visitor message. Default 0.",
          }

    PersonaSpec:
      type: object
      description: >
        How the bot SPEAKS. Folded into the system prompt by buildSystemPrompt — SERVER-ONLY,
        never returned by GET /api/widget/config.
      properties:
        toneOfVoice: { type: string, description: "Free text: warm, playful boulangerie owner." }
        styleRules:
          type: array
          items: { type: string }
          description: 'Discrete do/don''t rules: "never discuss competitors".'

    ConversationScript:
      type: object
      description: How a conversation STARTS. Projected to the widget.
      properties:
        opening:
          type: array
          items: { type: string }
          description: "Scripted bot-bubble sequence on open (projection caps at 5); opening[0] supersedes theme.greeting."
        starters:
          type: array
          items: { type: string }
          description: "Suggested-question chips on a fresh conversation (projection caps at 4)."

    PopupSpec:
      type: object
      required: [trigger, text]
      description: One engine for timed AND section-proximity teaser popups.
      properties:
        trigger:
          oneOf:
            - type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [timer] }
                delayMs: { type: integer, description: "Shown delayMs after load. Default 8000." }
            - type: object
              required: [kind, selector]
              properties:
                kind: { type: string, enum: [near] }
                selector: { type: string, description: "CSS selector to observe (≤200 chars)." }
                dwellMs: { type: integer, description: "Default 8000." }
                threshold: { type: number, description: "Intersection ratio. Default 0.3." }
        text: { type: string, description: "Teaser card copy (≤500 chars)." }
        persist:
          {
            type: boolean,
            description: "Default true → cooldownHours applies; false resets each load.",
          }
        cooldownHours: { type: integer, description: "Default 24; per-popup localStorage key." }
        cancelOnClick:
          { type: string, description: "Selector — clicking it dismisses the popup (≤200 chars)." }
        source:
          { type: string, description: "Origin label → session context / handoff / lead meta." }

    Operator:
      type: object
      required: [id]
      description: >
        A human the bot @mentions on handoff (quiet-ops). Auto-learned from topic replies;
        secret-adjacent (Telegram user ids) — never returned by GET /api/widget/config.
      properties:
        id:
          {
            type: integer,
            format: int64,
            description: "Telegram user id (enough for a text_mention).",
          }
        name: { type: string, description: "display name; mention label when no username." }
        username: { type: string, description: "public @username (preferred — plain @mention)." }

    AudioCall:
      type: object
      required: [id, status, requestedBy, createdAt, expiresAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [ringing, accepted, declined, canceled, expired, ended] }
        requestedBy: { type: string, enum: [operator, visitor] }
        createdAt: { type: integer }
        expiresAt: { type: integer }
        acceptedAt: { type: integer }
        endedAt: { type: integer }

    TenantConfig:
      type: object
      description: >
        The full tenant record `getTenant()` consumes. Returned in full only by the
        secret-guarded GET /api/tenant/config. Telegram credentials are optional for
        Cloud tenants using the Buttr operator app.
      properties:
        botToken: { type: string, description: "Optional Telegram bot token (BotFather)." }
        chatId:
          {
            type: string,
            description: "Optional supergroup id with Topics enabled, e.g. -1001234567890.",
          }
        systemPrompt: { type: string }
        model: { type: string }
        onboardingStep: { type: integer }
        onboardingComplete: { type: boolean }
        callSettings:
          type: object
          description: "Audio calls are opt-in; omitted booleans default to disabled."
          properties:
            enabled: { type: boolean }
            visitorRequestsEnabled: { type: boolean }
            visitorRequestTrigger:
              { type: string, enum: [after_handoff, always], default: after_handoff }
            notifyOnVisitorRequest: { type: boolean, default: true }
        forms:
          type: array
          items: { $ref: "#/components/schemas/FormSpec" }
        connectors:
          type: array
          items: { $ref: "#/components/schemas/Connector" }
        theme: { $ref: "#/components/schemas/WidgetTheme" }
        persona:
          allOf: [{ $ref: "#/components/schemas/PersonaSpec" }]
          description: "Bot voice + style rules. SERVER-ONLY — never exposed to the public widget config."
        script: { $ref: "#/components/schemas/ConversationScript" }
        popups:
          type: array
          items: { $ref: "#/components/schemas/PopupSpec" }
          description: "Proactive popup engine; theme.popupText is sugar for one timer popup."
        operators:
          type: array
          description: "Handoff-mention operators (auto-learned, capped at 10). NEVER exposed to the public widget config."
          items: { $ref: "#/components/schemas/Operator" }
